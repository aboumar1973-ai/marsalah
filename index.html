<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مرسالة | Marsalah</title>
<style>
*{box-sizing:border-box;font-family:system-ui,Tahoma,sans-serif}
body{margin:0;background:#0f172a;color:#fff;text-align:center}
header{padding:60px 20px;background:linear-gradient(135deg,#0ea5e9,#7c3aed)}
h1{font-size:42px;margin:0}
p{color:#e2e8f0;line-height:1.8}
.btn{display:inline-block;background:#fff;color:#0f172a;padding:14px 28px;border-radius:999px;font-weight:800;text-decoration:none;margin-top:20px}
section{padding:40px 20px;max-width:800px;margin:auto}
.card{background:#1e293b;padding:20px;border-radius:20px;margin:15px 0;text-align:right}
input,textarea{width:100%;padding:12px;border-radius:12px;border:0;margin:8px 0}
button{background:#22c55e;color:#fff;border:0;padding:14px;border-radius:12px;width:100%;font-size:18px;font-weight:800}
footer{padding:20px;color:#94a3b8}
</style>
</head>
<body>
<header>
<h1>مرسالة</h1>
<p>منصتك لإرسال الرسائل والتواصل بشكل أجمل وأسرع</p>
<a class="btn" href="#join">ابدأ الآن مجاناً</a>
</header>
<section>
<div class="card"><h3>🚀 سريع وسهل</h3><p>أرسل رسالتك في ثواني بدون تعقيد.</p></div>
<div class="card"><h3>💬 تواصل فعال</h3><p>وصل لعملائك وأصدقائك بطريقة احترافية.</p></div>
<div class="card"><h3>🔒 آمن وموثوق</h3><p>خصوصيتك أولويتنا.</p></div>
</section>
<section id="join">
<h2>انضم لمرسالة</h2>
<input placeholder="اسمك">
<input placeholder="رقم جوالك أو إيميلك">
<textarea placeholder="رسالتك..."></textarea>
<button onclick="alert('تم استلام طلبك! بنتواصل معك قريباً')">أرسل طلبك</button>
</section>
<footer>© 2026 مرسالة - Marsalah</footer>
</body>
</html>
